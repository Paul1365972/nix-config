<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preload" href="/m-plus-2.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/shared.css">
<script type="module" src="/usage.js"></script>
<main>
  <header class="topbar">
    <div class="brand">
      <img src="/icon.svg" width="30" height="30" alt="">
      <h1><b id="host"></b><span>usage</span></h1>
    </div>
    <nav>
      <button class="button primary" id="add-key"><span class="face">Add key</span></button>
    </nav>
  </header>
  <div class="passes" id="keys"></div>
  <footer class="footer" id="footer"></footer>
</main>

<dialog id="add-dialog" aria-labelledby="add-title">
  <form class="dialog-body" data-add>
    <h2 id="add-title">Add a key</h2>
    <label class="field">
      <span>Token or link</span>
      <input type="text" name="token" required placeholder="llm-… or https://…/#llm-…" autocomplete="off" spellcheck="false">
    </label>
    <p class="problem line" role="alert"></p>
    <p>The key is kept in this browser and nowhere else. Whoever has its token or link can spend from its limit.</p>
    <div class="dialog-actions">
      <button type="button" class="button ghost" data-action="close-dialog"><span class="face">Cancel</span></button>
      <button class="button primary"><span class="face">Add key</span><span class="face busy" aria-hidden="true"><i class="spinner"></i>Checking</span></button>
    </div>
  </form>
</dialog>
